<html lang="zh-CN">

    <title>采摘称重 - 农牧投蓝莓系统</title>

    <div id="root"><p>正在打开采摘称重原型… <a href="./delivery/index.html">点击打开</a></p></div>
    <script type="module">
      // 直接双击开发入口时跳转至离线交付物；构建后直接启动页面。
      if (location.protocol === 'file:' && !import.meta.env?.PROD) {
        location.replace(new URL(`./delivery/index.html${location.hash}`, location.href).href);
      } else {
        await import('/src/main.tsx');
      }
    </script>
